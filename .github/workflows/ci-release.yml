name: Lint and Release Magisk Module

on:
  push:
    branches:
      - main
    tags:
      - '20*'
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      core_tag:
        description: 'Optional tag from aapplle/AdguardHome-Mod-Fix (default: latest release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lint:
    name: Shell, YAML & Rules Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell scripts with sh -n and shellcheck
        run: |
          set -eu
          for f in Adguardhome/*.sh Adguardhome/scripts/*.sh; do
            sh -n "$f"
          done
          shellcheck -s sh -x -P Adguardhome/scripts -e SC2034 Adguardhome/*.sh Adguardhome/scripts/*.sh

      - name: Run rule, YAML, and path quality checks
        run: python3 scripts/lint_rules.py

  package:
    name: Build & Verify Module ZIP
    needs: lint
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify AdGuardHome arm64 core from AdguardHome-Mod-Fix
        env:
          CORE_REPO: aapplle/AdguardHome-Mod-Fix
          CORE_TAG: ${{ github.event.inputs.core_tag }}
        run: |
          set -eu
          mkdir -p /tmp/core-dl
          if [ -n "$CORE_TAG" ]; then
            BASE_URL="https://github.com/${CORE_REPO}/releases/download/${CORE_TAG}"
          else
            LATEST_TAG="$(curl -fsSL "https://api.github.com/repos/${CORE_REPO}/releases/latest" | jq -r '.tag_name')"
            BASE_URL="https://github.com/${CORE_REPO}/releases/download/${LATEST_TAG}"
          fi
          curl -fsSL "${BASE_URL}/AdGuardHome_linux_arm64.tar.gz" -o /tmp/core-dl/AdGuardHome_linux_arm64.tar.gz
          curl -fsSL "${BASE_URL}/checksums.txt" -o /tmp/core-dl/checksums.txt
          (cd /tmp/core-dl && sha256sum -c --ignore-missing checksums.txt)
          tar -xzf /tmp/core-dl/AdGuardHome_linux_arm64.tar.gz -C /tmp/core-dl
          install -m 0755 /tmp/core-dl/AdGuardHome/AdGuardHome Adguardhome/bin/AdGuardHome

      - name: Package Magisk module ZIP and checksums
        run: |
          set -eu
          VERSION="$(grep '^version=' Adguardhome/module.prop | cut -d= -f2)"
          mkdir -p dist
          ZIP_NAME="AdGuard.Home.For.Android.${VERSION}.zip"
          (cd Adguardhome && zip -r9 "../dist/${ZIP_NAME}" .)
          (cd dist && sha256sum "${ZIP_NAME}" > checksums.txt)
          ls -lh dist/

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module-zip
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
