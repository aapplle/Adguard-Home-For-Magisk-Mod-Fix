name: auto-rebase
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  issues: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/liuzq2002/Adguard-Home-For-Magisk-Mod.git
          git fetch upstream main

      - name: Check upstream changed
        id: check
        run: |
          BASE=$(git merge-base HEAD FETCH_HEAD)
          if [ "$BASE" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "no new upstream commits, nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name auto-rebase
          git config user.email auto-rebase@users.noreply.github.com
          git merge FETCH_HEAD -m "merge upstream $(git log -1 --format=%h FETCH_HEAD)"

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: git push origin main

      # 以下步骤无条件执行：即使上游源码没有新提交，也拉取最新 release 二进制
      # 并打包，保证每次手动/定时运行都能产出可直接刷入的最新模块 zip
      - name: Fetch latest upstream release binary
        run: |
          mkdir -p upstream
          URL=$(curl -s https://api.github.com/repos/liuzq2002/Adguard-Home-For-Magisk-Mod/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['assets'][0]['browser_download_url'])")
          curl -sL "$URL" -o upstream/module.zip
          unzip -q upstream/module.zip -d upstream/module
          cp -rf upstream/module/bin/. Adguardhome/bin/

      - name: Build module zip
        run: |
          mkdir -p build
          cd Adguardhome && zip -qr ../build/AdGuardHome-$(date +%Y%m%d).zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: build/

      - name: Open conflict issue
        if: failure() && steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '上游更新与设备修改冲突，需手动解决',
              body: '本地解决：git clone 你的 fork → git fetch upstream → git merge upstream/main → 解决冲突后 push'
            })